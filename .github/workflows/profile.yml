name: profile

# Daily refresh of the generated parts of the profile: the Writing list in
# README.md and the card under profile/. Commits only when something changed.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/writing.py

      # A failed fetch leaves the last good card in place. continue-on-error lets
      # the Writing list still be committed, and the last step fails the run
      # afterwards so a stale card does not hide behind a green run.
      - id: stats
        continue-on-error: true
        run: python3 tools/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          git add README.md profile
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh writing list and stats card"
          git push

      - if: ${{ always() && steps.stats.outcome == 'failure' }}
        run: |
          echo "::error::the stats card failed to refresh; the previous SVG was kept"
          exit 1
