name: profile

# Daily refresh of the generated parts of the profile: the Writing list in
# README.md and the cards under profile/. Commits only when something changed.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/writing.py

      # Third-party action holding a write token: pinned to the v2.1.0 commit.
      # fail_on_error keeps the last good card instead of writing an error card,
      # continue-on-error lets the Writing list still be committed, and the last
      # step fails the run afterwards so a stale card does not hide behind a green run.
      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        id: stats
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide=issues,contribs&hide_rank=true&theme=transparent&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        id: top_langs
        continue-on-error: true
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=css,html,scss,nsis&theme=transparent&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - run: |
          git add README.md profile
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh writing list and stats cards"
          git push

      - if: ${{ always() && (steps.stats.outcome == 'failure' || steps.top_langs.outcome == 'failure') }}
        run: |
          echo "::error::a stats card failed to refresh; the previous SVG was kept"
          exit 1
